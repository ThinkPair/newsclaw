[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsclaw"
version = "0.1.0"
description = "An independent local-first AI agent for personalized real-news discovery and understanding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NewsClaw Local Project" }]
keywords = ["news", "rss", "tushare", "ai", "agent", "recommendation", "content-discovery", "local-first", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]

dependencies = [
    "httpx[socks]>=0.27",
    # NewsClaw's three contracted news endpoints are provided by Tushare Pro.
    "tushare>=1.4.24",
    "scrapetube>=2.1",
    "yt-dlp>=2024.1.0",
    "bilibili-api-python>=16",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.66",
    # X (Twitter) discovery uses the import package ``twitter_cli``. Keep it in
    # the default install so enabling [sources.twitter] never fails at runtime.
    "twitter-cli>=0.8.5",
    # Reddit steady-state discovery uses the ``rdt`` console command. Keep it in
    # the default install so [sources.reddit].backend="rdt" works out of the box.
    "rdt-cli>=0.4.1",
    # Runtime-stream WebSockets are a core API used by the extension and web UI.
    "websockets>=13",
    # Runtime cover-image preprocessing imports PIL directly.
    "Pillow>=10.0",
    "fastapi>=0.115",
    "rich>=13",
    "typer>=0.12",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]
local-llm = [
    "ollama>=0.4",
]
x = [
    # Backwards-compatible alias for users/scripts that already install
    # ``openbiliclaw[x]``. The dependency is also part of the default runtime set.
    "twitter-cli>=0.8.5",
]
eval = [
    "claude-agent-sdk>=0.1",
]
browser = [
    "playwright>=1.40",
]
tls = [
    "cryptography>=41",
]
packaging = [
    # Desktop installer builds (packaging/build.py). Bundles the backend into a
    # macOS .app/.dmg or Windows onedir for the Inno Setup installer.
    "pyinstaller>=6.11",
    # System-tray desktop mode (packaging/entry.py): tray icon + menu so the app
    # runs without a console window — Windows system tray and macOS menu bar.
    "pystray>=0.19",
    # pystray's macOS backend needs pyobjc (Foundation / AppKit / Quartz).
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
newsclaw = "openbiliclaw.cli:app"
# Kept only as an internal compatibility alias while the upstream-derived
# module tree is progressively renamed. NewsClaw does not import an installed
# OpenBiliClaw package at runtime; all code is shipped in this repository.
openbiliclaw = "openbiliclaw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openbiliclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"src/openbiliclaw/llm/prompts.py" = ["E501"]  # Prompt templates contain long JSON examples
"src/openbiliclaw/llm/prompts_pipeline.py" = ["E501"]
"scripts/*.py" = ["E501"]  # Scripts contain long prompt strings

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiohttp",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "playwright.*",
    "twitter_cli",
    "twitter_cli.*",
    "x_client_transaction",
    "x_client_transaction.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: real Bilibili API checks that require local credentials",
]
